<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main>
        
        <section class="allEle">
            <div class="todo elems" id="0">
                <img src="https://images.unsplash.com/photo-1718202248232-0cdbc15d29b2?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8M2R8ZW58MHx8MHx8fDA%3D" alt="">
                <h2>To Do List</h2>
            </div>
            <div class="daily elems" id="1">
                <img src="https://images.unsplash.com/photo-1718202248233-938f2bced7e1?q=80&w=764&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
                <h2>Daily Planner</h2>
            </div>
            <div class="moti elems" id="2">
                <img src="https://images.unsplash.com/photo-1678986718987-76f0b9357e0f?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8M2R8ZW58MHx8MHx8fDA%3D" alt="">
                <h2>Motivation</h2>
            </div>
            <div class="pomo elems" id="3">
                <img src="https://images.unsplash.com/photo-1677249490921-3246e81f19e3?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTJ8fDNkfGVufDB8fDB8fHww" alt="">
                <h2>Pomodoro Timer</h2>
            </div>
            <div class="goals elems" id="4">
                <img src="https://plus.unsplash.com/premium_photo-1671199850205-12a94d7a3045?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTd8fDNkfGVufDB8fDB8fHww" alt="">
                <h2>Daily Goals</h2>
            </div>
            
        </section>

        <section class="fullElem todo-fullpage">
            <button class="back" id="0">Back</button>
            <h2>Your Personalised Task List</h2>
            <div class="task-container">
                <div class="addtask">
                    <form>
                        <input id="task-input" type="text" placeholder="Enter Task">
                        <textarea placeholder="Enter Details" name="" id=""></textarea>
                        <div class="mark-imp">
                            <input type="checkbox" name="" id="check">
                            <label for="check">Mark as Important</label>
                        </div>
                        <button>Add Task</button>
                    </form>
                </div>
                <div class="alltask">
                    
                </div>
            </div>
            
        </section>
        <section class="fullElem daily-planner-fullpage">
            <button class="back" id="1">Back</button>
            <h2>Plan your day to be more productive</h2>

            <div class="day-planner">
                
                
            </div>
        </section>
        <section class="fullElem Motivational-fullpage">
            <button class="back" id="2">Back</button>
            <div class="motivation-container">
                <div class="motivational-wrapper">
                    <div class="motivation-1">
                        <h2>Quote of the Day</h2>
                    </div>
                    <div class="motivation-2">
                        <h1></h1>
                    </div>
                    <div class="motivation-3">
                        <h2></h2>
                    </div>
                </div>
            </div>
        </section>
        <section class="fullElem Pomodoro-fullpage">
            <button class="back" id="3">Back</button>
            <h2>Study with me!</h2>
            <div class="pomo-timer">
                <h1>25:00</h1>
                <button class="start">Start</button>
                <button class="pause">Pause</button>
                <button class="reset">Reset</button>
            </div>
        </section>
        <section class="fullElem Daily-goals-fullpage">
            <button class="back" id="4">Back</button>
            <h1>Daily Goals</h1>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
